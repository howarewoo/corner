<!doctype html>
<html lang="en" data-corner-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Corner Design · Component catalog</title>
    <script>
      try {
        const theme = localStorage.getItem('corner-design-theme');
        document.documentElement.dataset.cornerTheme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
