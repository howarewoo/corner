services:
  corner:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      CORNER_DEPLOYMENT: local
      CORNER_ORIGIN: http://127.0.0.1:3000
      CORNER_HOST: 0.0.0.0
      CORNER_PORT: "3000"
      CORNER_DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:?Pull the Neon pooled DATABASE_URL}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?Pull the Neon direct URL for migrations}
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL:?Pull NEON_AUTH_BASE_URL}
      NEON_AUTH_REQUIRE_EMAIL_VERIFICATION: ${NEON_AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
    volumes:
      - corner-data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  corner-data:

