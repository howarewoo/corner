packages:
  - apps/*
  - packages/*

overrides:
  '@better-auth/core': 1.7.12
  better-auth: 1.7.12
  better-call: 1.4.4
  # Neon Auth and its bundled UI still pin the vulnerable Zod release.
  'zod@4.5.4': 4.6.7
  # Current shadcn/registry releases still allow the affected Undici version.
  'undici@7.29.1': 7.30.1
  # Drizzle Kit's legacy TS loader needs a patched esbuild; keep other consumers unchanged.
  '@esbuild-kit/core-utils>esbuild': 0.25.12

onlyBuiltDependencies:
  - esbuild
  - workerd
