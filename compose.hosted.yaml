# Self-host on one Linux server. The only public listener is the HTTPS edge.
# Prepare .env.hosted first; see HOSTING.md. This file creates no cloud resources.
services:
  corner:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CORNER_DEPLOYMENT: hosted
      CORNER_ORIGIN: https://app.${CORNER_DOMAIN:?Set CORNER_DOMAIN in .env.hosted}
      CORNER_LANDING_ORIGIN: https://${CORNER_DOMAIN:?Set CORNER_DOMAIN in .env.hosted}
      CORNER_DOCS_ORIGIN: https://docs.${CORNER_DOMAIN:?Set CORNER_DOMAIN in .env.hosted}
      CORNER_HOST: 0.0.0.0
      CORNER_PORT: '3000'
      CORNER_DATA_DIR: /app/data
      CORNER_PROXY_SECRET: ${CORNER_PROXY_SECRET:?Generate CORNER_PROXY_SECRET}
      DATABASE_URL: ${DATABASE_URL:?Pull the Neon pooled DATABASE_URL}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?Pull the Neon direct URL for migrations}
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL:?Pull NEON_AUTH_BASE_URL}
      NEON_AUTH_REQUIRE_EMAIL_VERIFICATION: 'true'
    volumes:
      - corner-data:/app/data
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  edge:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      corner:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      CORNER_DOMAIN: ${CORNER_DOMAIN:?Set CORNER_DOMAIN in .env.hosted}
      CORNER_PROXY_SECRET: ${CORNER_PROXY_SECRET:?Generate CORNER_PROXY_SECRET}
    volumes:
      - ./deployment/caddy:/etc/caddy:ro
      - corner-caddy-data:/data
      - corner-caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  corner-data:
  corner-caddy-data:
  corner-caddy-config:
