name: Deploy staging Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact successful current push-to-staging CI run ID
        type: string
        required: true
      source_sha:
        description: Exact current staging source SHA
        type: string
        required: true
      adoption_receipt:
        description: One-time staging cutover only; exact currently serving legacy deployment receipt ID
        type: string
        required: false
      adoption_host:
        description: One-time staging cutover only; exact direct database hostname
        type: string
        required: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/staging' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'staging' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: corner-staging-effects
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: corner-test-only
          POSTGRES_DB: corner_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d corner_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CORNER_TEST_DATABASE_URL: postgresql://postgres:corner-test-only@127.0.0.1:5432/corner_test
      CORNER_STAGING_CONFIG_JSON: ${{ vars.CORNER_STAGING_CONFIG_JSON }}
      CORNER_STAGING_ORIGIN: ${{ vars.CORNER_STAGING_ORIGIN }}
      CORNER_STAGING_BINDINGS_REVISION: ${{ vars.CORNER_STAGING_BINDINGS_REVISION }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the merged staging source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.15.0 <25'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Qualify, migrate, and deploy the isolated native staging Preview
        run: node scripts/staging-preview.mjs
        env:
          PREVIEW_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          PREVIEW_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
          PREVIEW_ADOPTION_RECEIPT: ${{ inputs.adoption_receipt }}
          PREVIEW_ADOPTION_HOST: ${{ inputs.adoption_host }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          CORNER_WORKER_SECRETS_JSON: ${{ secrets.CORNER_WORKER_SECRETS_JSON }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CORNER_STAGING_ACCESS_CLIENT_ID: ${{ secrets.CORNER_STAGING_ACCESS_CLIENT_ID }}
          CORNER_STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.CORNER_STAGING_ACCESS_CLIENT_SECRET }}
