name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test, build, and smoke check workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: corner-test-only
          POSTGRES_DB: corner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corner_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CORNER_TEST_DATABASE_URL: postgresql://postgres:corner-test-only@127.0.0.1:5432/corner_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.15.0 <25'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Azure mirror trickle downloads bypass APT timeouts: actions/runner-images#14823.
      - name: Use the standard Ubuntu archive mirror
        run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt

      - name: Install browser engines and Linux dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium webkit

      - name: Run full verification with timing evidence
        run: pnpm run verify -- --full --report "$RUNNER_TEMP/verification.jsonl"

      - name: Retain advisory command timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package the exact pushed revision without rebuilding
        if: github.event_name == 'push'
        run: >-
          pnpm run release:package -- "$RUNNER_TEMP/release/candidate"
          --source "$GITHUB_SHA"

      - name: Qualify the packaged Worker and migrator
        if: github.event_name == 'push'
        run: >-
          pnpm run release:qualify -- "$RUNNER_TEMP/release/candidate"
          --bootstrap --report "$RUNNER_TEMP/release/qualification.json"

      - name: Upload qualified release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corner-release-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90
