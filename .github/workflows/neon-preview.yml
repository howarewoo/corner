name: Create/Delete Neon Branch for Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: read

# Keep close events in the same group as creation, including merged PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  NEON_API_HOST: https://console.neon.tech/api/v2
  # Numeric-only names also avoid shell interpolation of PR-controlled refs.
  NEON_PREVIEW_BRANCH: preview/pr-${{ github.event.pull_request.number }}

jobs:
  read_pr_state:
    name: Read current PR state
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.pr.outputs.state }}
    steps:
      # GitHub concurrency is not FIFO; reconcile live state, not a stale event.
      - name: Read current PR state
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

  create_neon_branch:
    name: Create Neon Branch
    needs: read_pr_state
    if: needs.read_pr_state.outputs.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Set branch expiration (14 days from creation)
        shell: bash
        run: |
          expires_at="$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'EXPIRES_AT=%s\n' "$expires_at" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          api_host: ${{ env.NEON_API_HOST }}
          branch_name: ${{ env.NEON_PREVIEW_BRANCH }}
          parent_branch: production
          branch_type: schema-only
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}
          suspend_timeout: '300'
          ssl: verify-full

  delete_neon_branch:
    name: Delete Neon Branch
    needs: read_pr_state
    if: needs.read_pr_state.outputs.state == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview branch if it still exists
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --get \
            --url "$NEON_API_HOST/projects/$NEON_PROJECT_ID/branches" \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --data-urlencode "search=$NEON_PREVIEW_BRANCH" \
            --data-urlencode "limit=10000" \
            --output "$response_file"
          branch_id="$(jq -r --arg name "$NEON_PREVIEW_BRANCH" \
            '.branches[] | select(.name == $name) | .id' "$response_file")"
          if [[ -z "$branch_id" ]]; then
            echo "Preview branch is already absent."
            exit 0
          fi
          status="$(curl --silent --show-error --request DELETE \
            --url "$NEON_API_HOST/projects/$NEON_PROJECT_ID/branches/$branch_id" \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --output /dev/null --write-out '%{http_code}')"
          case "$status" in
            200|202|204|404) ;;
            *) printf '::error::Neon branch deletion failed (HTTP %s).\n' "$status"; exit 1 ;;
          esac
