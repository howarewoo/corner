name: Record production operational validation

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Exact current deployed/public-passed Corner ledger deployment ID
        type: string
        required: true
      operational_review:
        description: 'Nonsecret human JSON: sourceSha, versionId, reviewer (dispatch actor), accountAccess/saveReload/recovery/authOriginRoutingSecretsPersistence all "passed"'
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    environment: production-validation
    concurrency:
      group: corner-production-effects
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.15.0 <25'
      - name: Recheck exact current version and record protected human validation
        run: node scripts/release.mjs validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_OPERATIONAL_REVIEW: ${{ inputs.operational_review }}
