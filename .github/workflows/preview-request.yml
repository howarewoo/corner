name: Preview request

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Notify trusted reconciliation
        run: printf '%s\n' 'The default-branch preview reconciler re-reads live PR state; no PR application code or trusted result is supplied here.'
