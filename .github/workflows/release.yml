name: Approved production release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact successful push-to-main CI run ID (not used for rollback)
        type: string
      source_sha:
        description: Exact candidate main SHA (not used for rollback)
        type: string
      bootstrap:
        description: Explicit first Worker creation; never an artifact fallback
        type: boolean
        default: false
      rollback_deployment_id:
        description: Explicit completed qualified production deployment ID to recover
        type: string
      manual_review:
        description: 'Nonsecret JSON: sourceSha, reviewer (dispatch actor), affectedFlow, desktopWidth, phoneWidth, keyboardFocus:"passed"'
        type: string
        required: true

permissions:
  contents: read

env:
  CORNER_PRODUCTION_CONFIG_JSON: ${{ vars.CORNER_PRODUCTION_CONFIG_JSON }}
  CORNER_PRODUCTION_ORIGIN: ${{ vars.CORNER_PRODUCTION_ORIGIN }}
  CORNER_PRODUCTION_BINDINGS_REVISION: ${{ vars.CORNER_PRODUCTION_BINDINGS_REVISION }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.plan.outputs.deployment_id }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: corner-test-only
          POSTGRES_DB: corner_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d corner_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CORNER_TEST_DATABASE_URL: postgresql://postgres:corner-test-only@127.0.0.1:5432/corner_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.15.0 <25'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify provenance and qualify exact artifacts before approval
        id: plan
        run: node scripts/release.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_BOOTSTRAP: ${{ inputs.bootstrap }}
          RELEASE_ROLLBACK_ID: ${{ inputs.rollback_deployment_id }}
          RELEASE_MANUAL_REVIEW: ${{ inputs.manual_review }}

  promote:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: corner-production-effects
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: corner-test-only
          POSTGRES_DB: corner_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d corner_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CORNER_TEST_DATABASE_URL: postgresql://postgres:corner-test-only@127.0.0.1:5432/corner_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.15.0 <25'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Recheck approved baseline, migrate, and promote exact Worker version
        run: node scripts/release.mjs promote
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN_ID: ${{ needs.plan.outputs.deployment_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          CORNER_WORKER_SECRETS_JSON: ${{ secrets.CORNER_WORKER_SECRETS_JSON }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
